name: Aggregate Stats

on:
  schedule:
    - cron: '30 18 * * *' # 日本時間 毎日午前3:30 (UTC 18:30)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytz --force-reinstall

      - name: Debug - verify installed packages
        run: |
          python -m pip list | grep -i pytz
          python -c "import pytz; print('pytz OK:', pytz.__version__)"

      - name: Create credentials file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run Aggregator
        run: |
          python aggregate_stats.py
