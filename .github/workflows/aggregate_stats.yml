name: Aggregate Stats

on:
  schedule:
    - cron: '0 12 * * *' # 日本時間 毎日21:00 (UTC 12:00)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytz
          python -m pip install firebase-admin
          python -m pip install requests beautifulsoup4 tweepy python-dotenv
          python -m pip install -r requirements.txt

      - name: Debug - verify imports
        run: |
          python -c "import pytz; print('pytz OK:', pytz.__version__)"
          python -c "import firebase_admin; print('firebase_admin OK:', firebase_admin.__version__)"
          python -c "import bs4; print('bs4 OK:', bs4.__version__)"

      - name: Create credentials file
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON secret is EMPTY or NOT SET in this repository!"
            echo "Please add it in: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          printf '%s' "$FIREBASE_SA" > service_account.json
          FILE_SIZE=$(wc -c < service_account.json)
          echo "✅ service_account.json created: ${FILE_SIZE} bytes"
          python -c "import json; json.load(open('service_account.json')); print('✅ JSON is valid')"

      - name: Run Aggregator
        run: |
          python aggregate_stats.py
