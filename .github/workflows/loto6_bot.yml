name: Loto6 X Auto-Poster Bot

on:
  schedule:
    - cron: '0 * * * *'       # 1時間ごとに全自動で実行 (毎時0分)
  workflow_dispatch:          # GitHubの管理画面から「手動実行」も可能にします

permissions:
  contents: write             # キャッシュ(cache.json)の更新をリポジトリに保存するために書き込み権限を付与

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. 依存ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. ボットスクリプトの実行 (GitHub Secretsから環境変数を安全に注入)
      - name: Run Auto-Poster Bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_APP_URL: ${{ secrets.X_APP_URL }}
        run: python bot.py

      # 5. キャッシュファイル(cache.json)の自動書き戻し (二重投稿防止の整合性を維持)
      - name: Commit and push cache updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cache.json
          # 変更がある場合のみコミットしてプッシュ
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update last posted draw cache [skip ci]"
            git push
          else
            echo "No cache changes to commit."
          fi
